name: CI

# プルリクエストと、main 以外のブランチへのプッシュで、型検査・データ検証・テスト・ビルドを行う（公開はしない）
on:
  pull_request:
  push:
    branches-ignore: ['main', 'master']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Validate data integrity
        run: bun run validate

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
